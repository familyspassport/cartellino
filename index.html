<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5c5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cartellino">
<title>Cartellino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* Layout: una colonna centrata, tre schede (Cerca / Aggiungi / Tutti) */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#17201f; --muted:#5d6b69; --line:#d8dfdd;
  --accent:#0f5c5a; --accent-ink:#ffffff; --tag:#f6e9c9; --tag-ink:#3b2f12; --danger:#b3261e;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101615; --surface:#18201f; --ink:#e7eeec; --muted:#9aa9a6; --line:#2c3836;
  --accent:#5cc3b8; --accent-ink:#0b1514; --tag:#3a3220; --tag-ink:#f3e3bb; --danger:#f2867e; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,40px);margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px;margin:0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px}
.tabs button{font:600 15px var(--body);border:0;background:transparent;color:var(--muted);padding:12px 8px;border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.search input{width:100%;font:600 clamp(22px,5vw,32px) var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:16px 18px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.search input::placeholder{color:var(--muted);text-transform:none;letter-spacing:0;font-family:var(--body);font-weight:400;font-size:20px}
.hint{color:var(--muted);font-size:14px;margin:6px 2px 0}
.result{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
@media (max-width:620px){.result{grid-template-columns:1fr}}
.result img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--bg)}
.info{display:flex;flex-direction:column;gap:12px;min-width:0}
.tag{align-self:flex-start;font:600 26px var(--mono);letter-spacing:.06em;background:var(--tag);color:var(--tag-ink);padding:6px 16px 6px 26px;border-radius:4px 10px 10px 4px;position:relative}
.tag::before{content:"";position:absolute;left:9px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--surface)}
.meta{color:var(--muted);font-size:14px}
.note{white-space:pre-wrap;overflow-wrap:anywhere}
.empty{text-align:center;color:var(--muted);padding:40px 16px;border:2px dashed var(--line);border-radius:14px}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-size:20px;margin-bottom:4px}
form{display:flex;flex-direction:column;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
label{font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}
input[type=text],input[type=email],input[type=password],textarea{font:16px var(--body);padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
#f-code{font:600 20px var(--mono);text-transform:uppercase;letter-spacing:.05em}
textarea{min-height:80px;resize:vertical}
.photo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);border-radius:12px;min-height:180px;cursor:pointer;color:var(--muted);text-align:center;padding:12px;overflow:hidden;position:relative}
.photo img{max-height:320px;border-radius:8px}
.photo input{position:absolute;width:1px;height:1px;opacity:0}
.btn{font:600 16px var(--body);border:0;border-radius:10px;padding:14px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
.msg{font-size:14px;margin:0}
.msg.err{color:var(--danger)} .msg.ok{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;text-align:left;padding:0;color:inherit;font:inherit}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--bg)}
.card span{display:block;font:600 15px var(--mono);letter-spacing:.04em;padding:8px 10px}
.count{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.who{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.link{background:none;border:0;color:var(--accent);font:600 14px var(--body);cursor:pointer;padding:4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Cartellino</h1>
    <p class="sub" id="status">Caricamento…</p>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="cerca">Cerca</button>
    <button role="tab" aria-selected="false" data-tab="aggiungi">Aggiungi</button>
    <button role="tab" aria-selected="false" data-tab="tutti">Tutti</button>
  </nav>

  <section id="p-cerca">
    <div class="search">
      <input id="q" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Scrivi il codice del vestito">
      <p class="hint">Il vestito appare appena il codice corrisponde.</p>
    </div>
    <div id="out" style="margin-top:16px"></div>
  </section>

  <section id="p-aggiungi" hidden>
    <form id="login">
      <strong style="font-family:var(--display);font-size:20px">Accesso negozio</strong>
      <p class="hint" style="margin:0">Serve per aggiungere o eliminare vestiti. La ricerca è libera.</p>
      <label for="l-email">Email<input id="l-email" type="email" autocomplete="username" required></label>
      <label for="l-pass">Password<input id="l-pass" type="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit" id="l-btn">Entra</button>
      <p class="msg" id="l-msg" role="status"></p>
    </form>

    <div id="add-area" hidden style="display:flex;flex-direction:column;gap:12px">
      <div class="who"><span id="who"></span><button class="link" id="logout" type="button">Esci</button></div>
      <form id="f">
        <label for="f-code">Codice
          <span class="row">
            <input id="f-code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Es. V0001" required>
            <button type="button" class="btn ghost" id="gen">Prossimo libero</button>
          </span>
        </label>
        <label class="photo" for="f-photo">
          <span id="photo-label">Tocca per scattare o scegliere la foto</span>
          <input id="f-photo" type="file" accept="image/*" capture="environment">
        </label>
        <label for="f-note">Descrizione (facoltativa)
          <textarea id="f-note" placeholder="Es. Abito lino blu, taglia M, € 89"></textarea>
        </label>
        <button class="btn" id="save" type="submit">Salva vestito</button>
        <p class="msg" id="f-msg" role="status"></p>
      </form>
    </div>
  </section>

  <section id="p-tutti" hidden>
    <p class="count" id="count"></p>
    <div class="grid" id="grid"></div>
  </section>
</div>

<script>
// ===== CONFIGURAZIONE: incolla qui i dati del tuo progetto Supabase =====
const SUPABASE_URL = "https://znkchlvusjaogrvlbutl.supabase.co";
const SUPABASE_KEY = "sb_publishable_wKneTAKEr7ctUZ10RZdm9g_6JOOPbg4";
// =========================================================================

const BUCKET = "foto";
const $ = s => document.querySelector(s);
let sb = null, items = [], session = null, photoBlob = null, photoUrl = null;

const norm = s => (s||"").toUpperCase().replace(/\s+/g,"").replace(/[^A-Z0-9_.\-]/g,"");
const imgSrc = it => sb.storage.from(BUCKET).getPublicUrl(it.photo_path).data.publicUrl;
const fmtDate = d => d ? new Date(d).toLocaleDateString("it-IT",{day:"numeric",month:"short",year:"numeric"}) : "";

// ---- Schede
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => show(b.dataset.tab)));
function show(t){
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab===t));
  ["cerca","aggiungi","tutti"].forEach(n => $("#p-"+n).hidden = n!==t);
  if(t==="cerca") setTimeout(()=>$("#q").focus(),0);
}

// ---- Ricerca
$("#q").addEventListener("input", renderSearch);
function renderSearch(){
  const q = norm($("#q").value), out = $("#out");
  out.textContent = "";
  if(!q){ out.append(emptyBox(items.length ? "Scrivi un codice" : "Archivio vuoto", items.length ? `${items.length} vestiti in archivio.` : "Aggiungi il primo vestito dalla scheda Aggiungi.")); return; }
  const exact = items.find(i => i.code === q);
  if(exact){ out.append(detail(exact)); return; }
  const partial = items.filter(i => i.code.includes(q)).slice(0,24);
  if(partial.length){
    const p = document.createElement("p"); p.className="hint"; p.textContent = "Nessun codice esatto. Forse cercavi:";
    out.append(p, gridOf(partial));
  } else out.append(emptyBox("Codice non trovato", `Nessun vestito con codice ${q}.`));
}
function emptyBox(t, s){ const d=document.createElement("div"); d.className="empty"; const b=document.createElement("strong"); b.textContent=t; d.append(b, s); return d; }

function detail(it){
  const d = document.createElement("article"); d.className="result";
  const img = document.createElement("img"); img.alt = "Foto vestito " + it.code; img.src = imgSrc(it);
  const info = document.createElement("div"); info.className="info";
  const tag = document.createElement("div"); tag.className="tag"; tag.textContent = it.code;
  const note = document.createElement("div"); note.className="note"; note.textContent = it.note || "Nessuna descrizione.";
  const meta = document.createElement("div"); meta.className="meta"; meta.textContent = "Aggiunto il " + fmtDate(it.created_at);
  info.append(tag, note, meta);
  if(session){
    const del = document.createElement("button"); del.className="btn ghost"; del.textContent="Elimina vestito";
    del.onclick = () => {
      const c = document.createElement("div"); c.className="confirm";
      const yes = document.createElement("button"); yes.className="btn danger"; yes.textContent="Sì, elimina " + it.code;
      const no = document.createElement("button"); no.className="btn ghost"; no.textContent="Annulla";
      no.onclick = () => c.replaceWith(del);
      yes.onclick = async () => {
        yes.disabled = true;
        const { error } = await sb.from("vestiti").delete().eq("code", it.code);
        if(error){ yes.disabled=false; yes.textContent="Errore, riprova"; return; }
        await sb.storage.from(BUCKET).remove([it.photo_path]);
        await load();
      };
      c.append(yes, no); del.replaceWith(c);
    };
    info.append(del);
  }
  d.append(img, info); return d;
}

function gridOf(list){
  const g = document.createElement("div"); g.className="grid";
  list.forEach(it => {
    const c = document.createElement("button"); c.className="card"; c.type="button";
    const img = document.createElement("img"); img.alt=""; img.loading="lazy"; img.src = imgSrc(it);
    const s = document.createElement("span"); s.textContent = it.code;
    c.append(img, s);
    c.onclick = () => { $("#q").value = it.code; show("cerca"); renderSearch(); };
    g.append(c);
  });
  return g;
}

function renderAll(){
  $("#count").textContent = items.length ? `${items.length} vestiti, dal più recente` : "";
  const next = items.length ? gridOf(items) : emptyBox("Nessun vestito ancora","Usa la scheda Aggiungi per inserire il primo.");
  next.id = "grid"; $("#grid").replaceWith(next);
}

// ---- Caricamento dati (all'avvio, quando torni sulla pagina e ogni minuto)
async function load(){
  const all = []; let from = 0;
  while(true){
    const { data, error } = await sb.from("vestiti").select("*").order("created_at",{ascending:false}).range(from, from+999);
    if(error){ $("#status").textContent = "Archivio non raggiungibile. Controlla la connessione."; return; }
    all.push(...data); if(data.length < 1000) break; from += 1000;
  }
  items = all;
  $("#status").textContent = `${items.length} vestiti in archivio`;
  renderSearch(); renderAll();
}

// ---- Accesso
function setSession(s){
  session = s;
  $("#login").hidden = !!s;
  $("#add-area").hidden = !s;
  $("#who").textContent = s ? "Connesso come " + s.user.email : "";
  renderSearch();
}
$("#login").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("#l-btn"); btn.disabled = true; $("#l-msg").textContent = "Accesso…"; $("#l-msg").className = "msg";
  const { error } = await sb.auth.signInWithPassword({ email: $("#l-email").value.trim(), password: $("#l-pass").value });
  btn.disabled = false;
  if(error){ $("#l-msg").textContent = "Email o password errate."; $("#l-msg").className = "msg err"; }
  else { $("#l-msg").textContent = ""; $("#l-pass").value = ""; }
});
$("#logout").onclick = () => sb.auth.signOut();

// ---- Foto: ridimensiona a max 1400px JPEG
$("#f-photo").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; if(!f) return;
  try{
    photoBlob = await shrink(f);
    if(photoUrl) URL.revokeObjectURL(photoUrl);
    photoUrl = URL.createObjectURL(photoBlob);
    const lab = $("#photo-label"); lab.textContent = "";
    const im = document.createElement("img"); im.src = photoUrl; im.alt = "Anteprima";
    const t = document.createElement("span"); t.textContent = "Tocca per cambiare foto";
    lab.append(im, t);
  }catch(err){ msg("Questa foto non si apre. Prova con un'altra immagine.", "err"); }
});
function shrink(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const max = 1400, k = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement("canvas"); c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(), "image/jpeg", .85);
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(); };
    im.src = url;
  });
}

$("#gen").onclick = () => {
  let n = 0; items.forEach(i => { const m = /^V(\d+)$/.exec(i.code); if(m) n = Math.max(n, +m[1]); });
  $("#f-code").value = "V" + String(n+1).padStart(4,"0");
};

function msg(t, k){ const m=$("#f-msg"); m.textContent=t; m.className="msg "+(k||""); }

$("#f").addEventListener("submit", async e => {
  e.preventDefault();
  const code = norm($("#f-code").value);
  if(!code){ msg("Inserisci un codice (lettere, numeri, - _ .).", "err"); return; }
  if(!photoBlob){ msg("Aggiungi la foto del vestito.", "err"); return; }
  const btn = $("#save"); btn.disabled = true; msg("Salvataggio…");
  try{
    const { data: ex } = await sb.from("vestiti").select("code").eq("code", code).maybeSingle();
    if(ex){ msg(`Il codice ${code} è già usato. Scegline un altro.`, "err"); return; }
    const path = `${code}-${Date.now()}.jpg`;
    const up = await sb.storage.from(BUCKET).upload(path, photoBlob, { contentType: "image/jpeg" });
    if(up.error) throw up.error;
    const ins = await sb.from("vestiti").insert({ code, photo_path: path, note: $("#f-note").value.trim() });
    if(ins.error){
      await sb.storage.from(BUCKET).remove([path]);
      if(ins.error.code === "23505"){ msg(`Il codice ${code} è già usato. Scegline un altro.`, "err"); return; }
      throw ins.error;
    }
    msg(`Salvato: ${code}`, "ok");
    $("#f").reset(); photoBlob = null; $("#photo-label").textContent = "Tocca per scattare o scegliere la foto";
    await load();
  }catch(err){
    msg("Salvataggio non riuscito. Controlla la connessione e riprova.", "err");
    console.error(err);
  }finally{ btn.disabled = false; }
});

// ---- Avvio
renderSearch(); renderAll();
if(!window.supabase || SUPABASE_KEY.startsWith("INCOLLA")){
  $("#status").textContent = window.supabase ? "Manca la chiave Supabase nel file." : "Libreria non caricata. Controlla la connessione.";
} else {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  sb.auth.getSession().then(({ data }) => setSession(data.session));
  sb.auth.onAuthStateChange((_e, s) => setSession(s));
  load();
  document.addEventListener("visibilitychange", () => { if(!document.hidden) load(); });
  setInterval(() => { if(!document.hidden) load(); }, 60000);
}
</script>
</body>
</html>
