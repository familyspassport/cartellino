<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5c5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cartellino">
<title>Cartellino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* Layout: one centred column, three tabs (Search / Add / All) */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#17201f; --muted:#5d6b69; --line:#d8dfdd;
  --accent:#0f5c5a; --accent-ink:#ffffff; --tag:#f6e9c9; --tag-ink:#3b2f12; --danger:#b3261e;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101615; --surface:#18201f; --ink:#e7eeec; --muted:#9aa9a6; --line:#2c3836;
  --accent:#5cc3b8; --accent-ink:#0b1514; --tag:#3a3220; --tag-ink:#f3e3bb; --danger:#f2867e; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,40px);margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px;margin:0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px}
.tabs button{font:600 15px var(--body);border:0;background:transparent;color:var(--muted);padding:12px 8px;border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.search input{width:100%;font:600 clamp(22px,5vw,32px) var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:16px 18px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.search input::placeholder{color:var(--muted);text-transform:none;letter-spacing:0;font-family:var(--body);font-weight:400;font-size:20px}
.hint{color:var(--muted);font-size:14px;margin:6px 2px 0}
.result{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
@media (max-width:620px){.result{grid-template-columns:1fr}}
.gallery{display:flex;flex-direction:column;gap:8px;min-width:0}
.gallery .main{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--bg)}
.thumbs{display:flex;gap:8px}
.thumbs button{padding:0;border:2px solid transparent;border-radius:8px;background:none;cursor:pointer;width:72px;overflow:hidden}
.thumbs button[aria-pressed="true"]{border-color:var(--accent)}
.thumbs img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
.info{display:flex;flex-direction:column;gap:12px;min-width:0}
.tag{align-self:flex-start;font:600 26px var(--mono);letter-spacing:.06em;background:var(--tag);color:var(--tag-ink);padding:6px 16px 6px 26px;border-radius:4px 10px 10px 4px;position:relative}
.tag::before{content:"";position:absolute;left:9px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--surface)}
.meta{color:var(--muted);font-size:14px}
.note{white-space:pre-wrap;overflow-wrap:anywhere}
.empty{text-align:center;color:var(--muted);padding:40px 16px;border:2px dashed var(--line);border-radius:14px}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-size:20px;margin-bottom:4px}
form{display:flex;flex-direction:column;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
label{font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}
input[type=text],input[type=email],input[type=password],textarea{font:16px var(--body);padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
#f-code{font:600 20px var(--mono);text-transform:uppercase;letter-spacing:.05em}
textarea{min-height:80px;resize:vertical}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slot{display:flex;flex-direction:column;gap:6px;min-width:0}
.slot-title{font-weight:600;font-size:14px}
.slot-title small{color:var(--muted);font-weight:400}
.photo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);border-radius:12px;min-height:160px;color:var(--muted);text-align:center;padding:10px;overflow:hidden;position:relative;font-weight:400}
.photo img{max-height:260px;border-radius:8px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pick .btn{padding:10px 6px;font-size:14px;text-align:center;display:block}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.ver{color:var(--muted);font-size:12px;text-align:center;margin:0}
.pick{position:relative}
.btn{font:600 16px var(--body);border:0;border-radius:10px;padding:14px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
.msg{font-size:14px;margin:0}
.msg.err{color:var(--danger)} .msg.ok{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;text-align:left;padding:0;color:inherit;font:inherit;position:relative}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--bg)}
.card span{display:block;font:600 15px var(--mono);letter-spacing:.04em;padding:8px 10px}
.card .n{position:absolute;top:6px;right:6px;background:var(--surface);color:var(--ink);font:600 12px var(--body);padding:2px 7px;border-radius:999px}
.count{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.who{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.link{background:none;border:0;color:var(--accent);font:600 14px var(--body);cursor:pointer;padding:4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Cartellino</h1>
    <p class="sub" id="status">Loading…</p>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="cerca">Search</button>
    <button role="tab" aria-selected="false" data-tab="aggiungi">Add</button>
    <button role="tab" aria-selected="false" data-tab="tutti">All</button>
  </nav>

  <section id="p-cerca">
    <div class="search">
      <input id="q" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Type the item code">
      <p class="hint">The item appears as soon as the code matches.</p>
    </div>
    <div id="out" style="margin-top:16px"></div>
  </section>

  <section id="p-aggiungi" hidden>
    <form id="login">
      <strong style="font-family:var(--display);font-size:20px">Staff sign-in</strong>
      <p class="hint" style="margin:0">Needed to add or delete items. Searching is open to everyone.</p>
      <label for="l-email">Email<input id="l-email" type="email" autocomplete="username" required></label>
      <label for="l-pass">Password<input id="l-pass" type="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit" id="l-btn">Sign in</button>
      <p class="msg" id="l-msg" role="status"></p>
    </form>

    <div id="add-area" hidden style="display:flex;flex-direction:column;gap:12px">
      <div class="who"><span id="who"></span><button class="link" id="logout" type="button">Sign out</button></div>
      <form id="f">
        <label for="f-code">Code
          <span class="row">
            <input id="f-code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. V0001" required>
            <button type="button" class="btn ghost" id="gen">Next free</button>
          </span>
        </label>
        <div class="photos">
          <div class="slot">
            <span class="slot-title">Photo 1 <small>(required)</small></span>
            <div class="photo" data-slot="0"><span id="lab1">No photo yet</span></div>
            <div class="pick">
              <label class="btn ghost" for="cam1">Camera</label>
              <label class="btn ghost" for="gal1">Gallery</label>
              <input class="vh" id="cam1" data-slot="0" type="file" accept="image/*" capture="environment">
              <input class="vh" id="gal1" data-slot="0" type="file" accept="image/*">
            </div>
          </div>
          <div class="slot">
            <span class="slot-title">Photo 2 <small>(optional)</small></span>
            <div class="photo" data-slot="1"><span id="lab2">No photo yet</span></div>
            <div class="pick">
              <label class="btn ghost" for="cam2">Camera</label>
              <label class="btn ghost" for="gal2">Gallery</label>
              <input class="vh" id="cam2" data-slot="1" type="file" accept="image/*" capture="environment">
              <input class="vh" id="gal2" data-slot="1" type="file" accept="image/*">
            </div>
            <button type="button" class="link" id="rm2" hidden>Remove photo 2</button>
          </div>
        </div>
        <label for="f-note">Description (optional)
          <textarea id="f-note" placeholder="e.g. Blue linen dress, size M, $89"></textarea>
        </label>
        <button class="btn" id="save" type="submit">Save item</button>
        <p class="msg" id="f-msg" role="status"></p>
      </form>
    </div>
  </section>

  <section id="p-tutti" hidden>
    <p class="count" id="count"></p>
    <div class="grid" id="grid"></div>
  </section>
  <p class="ver">Version 4 · <a href="backup.html" style="color:inherit">Backup</a></p>
</div>

<script>
// ===== CONFIG =====
const SUPABASE_URL = "https://znkchlvusjaogrvlbutl.supabase.co";
const SUPABASE_KEY = "sb_publishable_wKneTAKEr7ctUZ10RZdm9g_6JOOPbg4";
// ==================

const BUCKET = "foto";
const PH1 = "No photo yet", PH2 = "No photo yet";
const $ = s => document.querySelector(s);
let sb = null, items = [], session = null;
const photos = [null, null];   // resized blobs for slot 1 and 2
const previews = [null, null];

const norm = s => (s||"").toUpperCase().replace(/\s+/g,"").replace(/[^A-Z0-9_.\-]/g,"");
const urlOf = path => sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
const pathsOf = it => [it.photo_path, it.photo_path2].filter(Boolean);
const fmtDate = d => d ? new Date(d).toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"}) : "";

// ---- Tabs
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => show(b.dataset.tab)));
function show(t){
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab===t));
  ["cerca","aggiungi","tutti"].forEach(n => $("#p-"+n).hidden = n!==t);
  if(t==="cerca") setTimeout(()=>$("#q").focus(),0);
}

// ---- Search
$("#q").addEventListener("input", renderSearch);
function renderSearch(){
  const q = norm($("#q").value), out = $("#out");
  out.textContent = "";
  if(!q){ out.append(emptyBox(items.length ? "Type a code" : "No items yet", items.length ? `${items.length} items in stock.` : "Add the first item from the Add tab.")); return; }
  const exact = items.find(i => i.code === q);
  if(exact){ out.append(detail(exact)); return; }
  const partial = items.filter(i => i.code.includes(q)).slice(0,24);
  if(partial.length){
    const p = document.createElement("p"); p.className="hint"; p.textContent = "No exact match. Did you mean:";
    out.append(p, gridOf(partial));
  } else out.append(emptyBox("Code not found", `No item with code ${q}.`));
}
function emptyBox(t, s){ const d=document.createElement("div"); d.className="empty"; const b=document.createElement("strong"); b.textContent=t; d.append(b, s); return d; }

function detail(it){
  const d = document.createElement("article"); d.className="result";
  const gal = document.createElement("div"); gal.className="gallery";
  const paths = pathsOf(it);
  const main = document.createElement("img"); main.className="main"; main.alt = "Item " + it.code; main.src = urlOf(paths[0]);
  gal.append(main);
  if(paths.length > 1){
    const th = document.createElement("div"); th.className="thumbs";
    paths.forEach((p, i) => {
      const b = document.createElement("button"); b.type="button"; b.setAttribute("aria-pressed", i===0); b.setAttribute("aria-label", "Photo " + (i+1));
      const im = document.createElement("img"); im.src = urlOf(p); im.alt = "";
      b.append(im);
      b.onclick = () => { main.src = urlOf(p); th.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x===b)); };
      th.append(b);
    });
    gal.append(th);
  }
  const info = document.createElement("div"); info.className="info";
  const tag = document.createElement("div"); tag.className="tag"; tag.textContent = it.code;
  const note = document.createElement("div"); note.className="note"; note.textContent = it.note || "No description.";
  const meta = document.createElement("div"); meta.className="meta"; meta.textContent = "Added " + fmtDate(it.created_at);
  info.append(tag, note, meta);
  if(session){
    const del = document.createElement("button"); del.className="btn ghost"; del.textContent="Delete item";
    del.onclick = () => {
      const c = document.createElement("div"); c.className="confirm";
      const yes = document.createElement("button"); yes.className="btn danger"; yes.textContent="Yes, delete " + it.code;
      const no = document.createElement("button"); no.className="btn ghost"; no.textContent="Cancel";
      no.onclick = () => c.replaceWith(del);
      yes.onclick = async () => {
        yes.disabled = true;
        const { error } = await sb.from("vestiti").delete().eq("code", it.code);
        if(error){ yes.disabled=false; yes.textContent="Error, try again"; return; }
        await sb.storage.from(BUCKET).remove(paths);
        await load();
      };
      c.append(yes, no); del.replaceWith(c);
    };
    info.append(del);
  }
  d.append(gal, info); return d;
}

function gridOf(list){
  const g = document.createElement("div"); g.className="grid";
  list.forEach(it => {
    const c = document.createElement("button"); c.className="card"; c.type="button";
    const img = document.createElement("img"); img.alt=""; img.loading="lazy"; img.src = urlOf(it.photo_path);
    const s = document.createElement("span"); s.textContent = it.code;
    c.append(img, s);
    if(it.photo_path2){ const n = document.createElement("i"); n.className="n"; n.textContent = "2 photos"; c.append(n); }
    c.onclick = () => { $("#q").value = it.code; show("cerca"); renderSearch(); };
    g.append(c);
  });
  return g;
}

function renderAll(){
  $("#count").textContent = items.length ? `${items.length} items, newest first` : "";
  const next = items.length ? gridOf(items) : emptyBox("No items yet","Use the Add tab to add the first one.");
  next.id = "grid"; $("#grid").replaceWith(next);
}

// ---- Data (on start, when you come back to the page, and every minute)
async function load(){
  const all = []; let from = 0;
  while(true){
    const { data, error } = await sb.from("vestiti").select("*").order("created_at",{ascending:false}).range(from, from+999);
    if(error){ $("#status").textContent = "Can't reach the database. Check your connection."; return; }
    all.push(...data); if(data.length < 1000) break; from += 1000;
  }
  items = all;
  $("#status").textContent = `${items.length} items in stock`;
  renderSearch(); renderAll();
}

// ---- Sign-in
function setSession(s){
  session = s;
  $("#login").hidden = !!s;
  $("#add-area").hidden = !s;
  $("#who").textContent = s ? "Signed in as " + s.user.email : "";
  renderSearch();
}
$("#login").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("#l-btn"); btn.disabled = true; $("#l-msg").textContent = "Signing in…"; $("#l-msg").className = "msg";
  const { error } = await sb.auth.signInWithPassword({ email: $("#l-email").value.trim(), password: $("#l-pass").value });
  btn.disabled = false;
  if(error){ $("#l-msg").textContent = "Wrong email or password."; $("#l-msg").className = "msg err"; }
  else { $("#l-msg").textContent = ""; $("#l-pass").value = ""; }
});
$("#logout").onclick = () => sb.auth.signOut();

// ---- Photos: resize to max 1400px JPEG
function setSlot(i, blob){
  photos[i] = blob;
  if(previews[i]) URL.revokeObjectURL(previews[i]);
  previews[i] = blob ? URL.createObjectURL(blob) : null;
  const lab = $("#lab" + (i+1)); lab.textContent = "";
  if(blob){
    const im = document.createElement("img"); im.src = previews[i]; im.alt = "Preview";
    lab.append(im);
  } else lab.textContent = i === 0 ? PH1 : PH2;
  if(i === 1) $("#rm2").hidden = !blob;
}
document.querySelectorAll(".pick input[type=file]").forEach(inp => inp.addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; if(!f) return;
  try{ setSlot(+inp.dataset.slot, await shrink(f)); }
  catch(err){ msg("This photo can't be opened. Try another image.", "err"); }
  e.target.value = "";
}));
$("#rm2").onclick = () => setSlot(1, null);

function shrink(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const max = 1400, k = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement("canvas"); c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(), "image/jpeg", .85);
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(); };
    im.src = url;
  });
}

$("#gen").onclick = () => {
  let n = 0; items.forEach(i => { const m = /^V(\d+)$/.exec(i.code); if(m) n = Math.max(n, +m[1]); });
  $("#f-code").value = "V" + String(n+1).padStart(4,"0");
};

function msg(t, k){ const m=$("#f-msg"); m.textContent=t; m.className="msg "+(k||""); }

$("#f").addEventListener("submit", async e => {
  e.preventDefault();
  const code = norm($("#f-code").value);
  if(!code){ msg("Enter a code (letters, numbers, - _ .).", "err"); return; }
  if(!photos[0]){ msg("Add photo 1 of the item.", "err"); return; }
  const btn = $("#save"); btn.disabled = true; msg("Saving…");
  const uploaded = [];
  try{
    const { data: ex } = await sb.from("vestiti").select("code").eq("code", code).maybeSingle();
    if(ex){ msg(`Code ${code} is already used. Choose another one.`, "err"); return; }
    const stamp = Date.now();
    for(const [i, blob] of photos.entries()){
      if(!blob) continue;
      const path = `${code}-${stamp}-${i+1}.jpg`;
      const up = await sb.storage.from(BUCKET).upload(path, blob, { contentType: "image/jpeg" });
      if(up.error) throw up.error;
      uploaded.push(path);
    }
    const row = { code, photo_path: uploaded[0], note: $("#f-note").value.trim() };
    if(uploaded[1]) row.photo_path2 = uploaded[1];
    const ins = await sb.from("vestiti").insert(row);
    if(ins.error){
      if(ins.error.code === "23505"){ await sb.storage.from(BUCKET).remove(uploaded); msg(`Code ${code} is already used. Choose another one.`, "err"); return; }
      throw ins.error;
    }
    msg(`Saved: ${code}`, "ok");
    $("#f").reset(); setSlot(0, null); setSlot(1, null);
    await load();
  }catch(err){
    if(uploaded.length) await sb.storage.from(BUCKET).remove(uploaded);
    msg("Couldn't save. Check your connection and try again.", "err");
    console.error(err);
  }finally{ btn.disabled = false; }
});

// ---- Start
renderSearch(); renderAll();
if(!window.supabase || SUPABASE_KEY.startsWith("PASTE")){
  $("#status").textContent = window.supabase ? "Supabase key missing in the file." : "Library didn't load. Check your connection.";
} else {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  sb.auth.getSession().then(({ data }) => setSession(data.session));
  sb.auth.onAuthStateChange((_e, s) => setSession(s));
  load();
  document.addEventListener("visibilitychange", () => { if(!document.hidden) load(); });
  setInterval(() => { if(!document.hidden) load(); }, 60000);
}
</script>
</body>
</html>
